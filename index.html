      height: auto;

  <header class="site-header">
    <p class="eyebrow">GRENOBLE INP · ENSE³</p>

    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="7" y="7" width="86" height="86" rx="25"
              fill="#0b2a4d" stroke="#3979b8" stroke-width="1.5"/>
        <circle cx="50" cy="53" r="30" fill="#f3f6fc"/>
        <circle cx="28" cy="31" r="9" fill="#f3f6fc"/>
        <circle cx="72" cy="31" r="9" fill="#f3f6fc"/>
        <path d="M20 34 Q19 9 48 9 Q70 9 80 31 L72 39 Q50 24 28 42Z" fill="#c8324c"/>
        <path d="M20 35 Q46 24 75 37 L74 44 Q47 32 24 44Z" fill="#fff"/>
        <circle cx="39" cy="51" r="3" fill="#102744"/>
        <circle cx="61" cy="51" r="3" fill="#102744"/>
        <ellipse cx="50" cy="62" rx="13" ry="9" fill="#d8e2f0"/>
        <ellipse cx="50" cy="59" rx="5" ry="4" fill="#102744"/>
        <path d="M50 63 L50 68 Q44 73 39 68 M50 68 Q56 73 61 68"
              fill="none" stroke="#102744" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>Secret <span>Santa</span></h1>
    <div class="title-underline"></div>
  </header>

  <main>
    <section class="panel" aria-labelledby="signup-title">
      <div class="panel-heading">
        <span class="step-number">01</span>
        <h2 id="signup-title">Inscription</h2>
      </div>

      <form id="signup-form">
        <div class="form-grid">
          <label class="field">
            <span class="field-content">
              <span class="field-label">Prénom</span>
              <input type="text" name="first_name" placeholder="Prénom"
                     autocomplete="given-name" required>
            </span>
          </label>

          <label class="field">
            <span class="field-content">
              <span class="field-label">Nom</span>
              <input type="text" name="last_name" placeholder="Nom"
                     autocomplete="family-name" required>
            </span>
          </label>

          <label class="field field-wide">
            <span class="field-content">
              <span class="field-label">Téléphone</span>
              <input type="tel" name="phone" placeholder="06 12 34 56 78"
                     autocomplete="tel" required>
            </span>
          </label>

          <label class="field field-wide field-photo" for="photo-input">
            <span class="field-content">
              <span class="field-label">Photo</span>
              <input type="file" id="photo-input" accept="image/*" class="hidden">
              <span id="photo-placeholder" class="photo-placeholder">
                <span id="photo-title">Choisir ou prendre une photo</span>
              </span>
              <img id="photo-preview" class="photo-preview hidden" alt="Aperçu de la photo">
            </span>
          </label>
        </div>

        <button class="button button-red" type="submit">
          Obtenir mon code <span aria-hidden="true">→</span>
        </button>
        <p id="signup-result" class="result-message hidden" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel" aria-labelledby="lookup-title">
      <div class="panel-heading">
        <span class="step-number">02</span>
        <h2 id="lookup-title">Mon destinataire</h2>
      </div>

      <form id="lookup-form">
        <label class="field field-code">
          <span class="field-content">
            <span class="field-label">Code secret</span>
            <input type="text" name="code" placeholder="ABC-123"
                   maxlength="7" autocomplete="off" required>
          </span>
        </label>

        <button class="button button-gold" type="submit">
          Révéler <span aria-hidden="true">→</span>
        </button>
        <p id="lookup-result" class="result-message hidden" aria-live="polite"></p>
      </form>
    </section>

    <!-- Administration discrète et repliée par défaut -->
    <details class="admin-discreet">
      <summary>Administration</summary>

      <section class="panel admin-panel" aria-label="Administration">
        <form id="admin-login-form">
          <label class="field">
            <span class="field-content">
              <span class="field-label">Mot de passe</span>
              <input type="password" name="password" placeholder="Mot de passe"
                     autocomplete="current-password" required>
            </span>
          </label>

          <button class="button button-blue" type="submit">
            Se connecter
          </button>
        </form>

        <p id="admin-message" class="result-message hidden" aria-live="polite"></p>

        <div id="admin-panel" class="hidden" hidden>
          <div class="admin-stats">
            <span>Participants</span>
            <strong id="participant-count">—</strong>
          </div>

          <p id="draw-status" class="result-message" aria-live="polite"></p>

          <div class="admin-actions">
            <button id="draw-button" class="button button-gold" type="button">
              Lancer le tirage
            </button>
            <button id="refresh-results" class="button button-blue" type="button">
              Actualiser
            </button>
            <button id="admin-logout" class="button button-secondary" type="button">
              Déconnexion
            </button>
          </div>

          <ul id="participant-list" class="participant-list"></ul>
          <div id="admin-results" class="admin-results hidden"></div>
        </div>
      </section>
    </details>
  </main>

  <script src="./app.js"></script>
</body>
</html>
